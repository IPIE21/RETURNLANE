<head>

<meta name="description" content="Get first access to Drop 001: Ride the Tiger.">

<link rel="stylesheet" href="assets/styles.css">

<body>
<main id="content">

<section class="hero"><div class="grain"></div><div class="wrap">
  <div>
    <div class="eyebrow">Drop 001 · First access</div>
    <h1 style="font-size:clamp(48px,9vw,110px)"><span>Ride the</span><span class="script" style="font-size:.9em">Tiger</span></h1>
    <p class="lede">Waitlist members get the preorder link before anyone else. Small first run.</p>
    
<form class="signup" data-endpoint="waitlistEndpoint" data-source="waitlist" novalidate>
  <div class="field"><label for="email-waitlist">Email</label>
    <input id="email-waitlist" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
  <div class="field" style="flex:0 1 140px"><label for="size-waitlist">Your size</label>
    <select id="size-waitlist" name="size"><option value="">Not sure</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>2XL</option></select></div>
  <label class="check" for="consent-waitlist"><input id="consent-waitlist" name="consent" type="checkbox" value="yes"> Email me about Drop 001 and future drops. Unsubscribe anytime.</label>
  <button class="btn red full" type="submit">Join the waitlist</button>
  <p class="form-msg" role="status" aria-live="polite"></p>
</form>
  </div>
  <div class="art"><img src="assets/img/rtt-orange-pair.jpg" alt="Front and back of the Ride the Tiger tee" width="1536" height="1024">
    <p class="caption">Concept artwork. Not a photo of the finished shirt.</p></div>
</div></section>

</main>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
